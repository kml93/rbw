name: release
on:
  push:
    tags: ["*-kml93.*"]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-linux-android
            # arboard (clipboard support) does not build on Android
            cargo-flags: --no-default-features
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get install -y clang-18
          echo "TARGET_CC=clang-18" >> "$GITHUB_ENV"
          echo "TARGET_AR=llvm-ar-18" >> "$GITHUB_ENV"
      - name: Configure the Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        env:
          # Termux supports Android 7.0 (API level 24) and later
          ANDROID_API_LEVEL: 24
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ndk_cc="$ndk_bin/aarch64-linux-android$ANDROID_API_LEVEL-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_cc" >> "$GITHUB_ENV"
          echo "TARGET_CC=$ndk_cc" >> "$GITHUB_ENV"
          echo "TARGET_AR=$ndk_bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build
        env:
          CARGO_FLAGS: ${{ matrix.cargo-flags }}
        run: cargo build --release --locked --target "$TARGET" $CARGO_FLAGS
      - name: Smoke-test the binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/"$TARGET"/release/rbw --version
      - name: Package
        run: tar -czf "rbw_${GITHUB_REF_NAME}_$TARGET.tar.gz" -C target/"$TARGET"/release rbw rbw-agent
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: rbw_*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksum the archives
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      # Draft only: the release is published by hand once its notes are written
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "$GITHUB_REF_NAME" --notes ""
